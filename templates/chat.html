{% extends "base.html" %}

{% block title %}Flasky - Chatbot{% endblock %}

{% block page_content %}
<div class="page-header">
    <h1>Chatbot</h1>
</div>

<div id="chat-log" class="well" style="height: 300px; overflow-y: auto;"></div>

<form id="chat-form" class="form-inline">
    <div class="form-group">
        <input type="text" id="message" class="form-control" placeholder="Type a message..." autocomplete="off" required>
    </div>
    <button type="submit" class="btn btn-primary">Send</button>
</form>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    const log = document.getElementById('chat-log');
    const input = document.getElementById('message');

    function addLine(speaker, text) {
        const p = document.createElement('p');
        const b = document.createElement('strong');
        b.textContent = speaker + ': ';
        p.appendChild(b);
        p.appendChild(document.createTextNode(text));
        log.appendChild(p);
        log.scrollTop = log.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = input.value.trim();
        if (!message) return;
        addLine('You', message);
        input.value = '';

        const res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });
        const data = await res.json();
        addLine('Bot', data.reply);
    });
</script>
{% endblock %}
